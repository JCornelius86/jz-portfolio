<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ear tips — single pixel -->
  <rect x="1" y="0" width="1" height="1" fill="#FF8C00"/>
  <rect x="14" y="0" width="1" height="1" fill="#FF8C00"/>
  <!-- Ears widen -->
  <rect x="0" y="1" width="2" height="1" fill="#FF8C00"/>
  <rect x="14" y="1" width="2" height="1" fill="#FF8C00"/>
  <!-- Ears with inner color -->
  <rect x="0" y="2" width="1" height="1" fill="#FF8C00"/>
  <rect x="1" y="2" width="1" height="1" fill="#FFB347"/>
  <rect x="2" y="2" width="1" height="1" fill="#FF8C00"/>
  <rect x="13" y="2" width="1" height="1" fill="#FF8C00"/>
  <rect x="14" y="2" width="1" height="1" fill="#FFB347"/>
  <rect x="15" y="2" width="1" height="1" fill="#FF8C00"/>
  <!-- Head connects through ears -->
  <rect x="0" y="3" width="1" height="1" fill="#FF8C00"/>
  <rect x="1" y="3" width="1" height="1" fill="#FFB347"/>
  <rect x="2" y="3" width="12" height="1" fill="#FF8C00"/>
  <rect x="14" y="3" width="1" height="1" fill="#FFB347"/>
  <rect x="15" y="3" width="1" height="1" fill="#FF8C00"/>
  <!-- Widest row — full 16px -->
  <rect x="0" y="4" width="16" height="1" fill="#FF8C00"/>
  <!-- Eye row -->
  <rect x="1" y="5" width="3" height="1" fill="#FF8C00"/>
  <rect x="4" y="5" width="2" height="1" fill="#ffffff"/>
  <rect x="6" y="5" width="4" height="1" fill="#FF8C00"/>
  <rect x="10" y="5" width="2" height="1" fill="#ffffff"/>
  <rect x="12" y="5" width="3" height="1" fill="#FF8C00"/>
  <!-- Pupil row -->
  <rect x="1" y="6" width="3" height="1" fill="#FF8C00"/>
  <rect x="4" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="5" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="6" y="6" width="4" height="1" fill="#FF8C00"/>
  <rect x="10" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="11" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="12" y="6" width="3" height="1" fill="#FF8C00"/>
  <!-- Taper below eyes -->
  <rect x="2" y="7" width="12" height="1" fill="#FF8C00"/>
  <!-- Muzzle -->
  <rect x="3" y="8" width="2" height="1" fill="#FF8C00"/>
  <rect x="5" y="8" width="6" height="1" fill="#F5E6D0"/>
  <rect x="11" y="8" width="2" height="1" fill="#FF8C00"/>
  <!-- Nose -->
  <rect x="4" y="9" width="1" height="1" fill="#FF8C00"/>
  <rect x="5" y="9" width="2" height="1" fill="#F5E6D0"/>
  <rect x="7" y="9" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="9" width="2" height="1" fill="#F5E6D0"/>
  <rect x="11" y="9" width="1" height="1" fill="#FF8C00"/>
  <!-- Mouth -->
  <rect x="5" y="10" width="1" height="1" fill="#FF8C00"/>
  <rect x="6" y="10" width="1" height="1" fill="#F5E6D0"/>
  <rect x="7" y="10" width="2" height="1" fill="#2a2a3e"/>
  <rect x="9" y="10" width="1" height="1" fill="#F5E6D0"/>
  <rect x="10" y="10" width="1" height="1" fill="#FF8C00"/>
  <!-- Lower jaw -->
  <rect x="6" y="11" width="1" height="1" fill="#FF8C00"/>
  <rect x="7" y="11" width="2" height="1" fill="#F5E6D0"/>
  <rect x="9" y="11" width="1" height="1" fill="#FF8C00"/>
  <!-- Chin point -->
  <rect x="7" y="12" width="2" height="1" fill="#FF8C00"/>
</svg>
